<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>William's Portfolio</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <div class="nav-logo">
        <img src="logo99.png" alt="William's Logo" class="logo-img" />
      </div>
      <div class="nav-links">
        <a href="index.html" style="color: var(--accent)">Home</a>
        <a href="about.html">About</a>
        <a href="skills.html">Skills</a>
        <a href="blog.html">Blog</a>
        <a href="contact.html">Contact</a>
        <button id="theme-toggle">🌓</button>
      </div>
    </nav>

    <header class="hero" style="display: flex; align-items: center; justify-content: center; gap: 4rem; flex-wrap: wrap; padding: 6rem 2rem; max-width: 1000px; margin: 0 auto;">
      
      <div class="hero-content" style="flex: 1; min-width: 300px; text-align: left;">
        <h1 style="font-size: 3rem; margin-bottom: 1rem;">Hi, I'm William.</h1>
        <p style="font-size: 1.2rem; line-height: 1.6; margin-bottom: 2rem;">
          A Full-Stack Developer & Computer Science Student building things for
          the web and the physical world.
        </p>
        <a href="about.html" class="btn">More About Me</a>
      </div>

      <div class="hero-image" style="flex: 1; min-width: 300px; text-align: center;">
        <img 
          src="me.jpg" 
          alt="William " 
          style="width: 280px; height: 280px; border-radius: 50%; object-fit: cover; border: 4px solid var(--accent, #555); box-shadow: 0 4px 15px rgba(0,0,0,0.2);" 
        />
      </div>

    </header>

    <footer>
      <p>© 2026 William Ong Xuan Wei.</p>
    </footer>

    <script>
      const toggleButton = document.getElementById("theme-toggle");
      const currentTheme = localStorage.getItem("theme");

      // 1. When the page loads, check if they previously chose dark mode
      if (currentTheme === "dark") {
        document.body.classList.add("dark-theme");
      }

      // 2. When the button is clicked, toggle the theme AND save the preference
      toggleButton.addEventListener("click", () => {
        document.body.classList.toggle("dark-theme");

        // If the body now has 'dark-theme', save 'dark' to storage. Otherwise, save 'light'.
        if (document.body.classList.contains("dark-theme")) {
          localStorage.setItem("theme", "dark");
        } else {
          localStorage.setItem("theme", "light");
        }
      });
    </script>
  </body>
</html>
